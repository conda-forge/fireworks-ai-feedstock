schema_version: 1

context:
  name: fireworks-ai
  version: "1.2.39"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/ec/d8/cefbe43464e5a34791e4f05ac3a97e28f932643df4e82c26a4572b0200f3/fireworks_ai-${{ version }}.tar.gz
  sha256: 921130bd6ab48de1520f4826d441a012b590c3d4f0e88dd06acd443633fbeb45

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-fancy-pypi-readme
    - pip
  run:
    - python >=${{ python_min }}
    - httpx >=0.23.0,<1
    - pydantic >=1.9.0,<3
    - typing_extensions >=4.14,<5
    - aiohttp
    - sniffio
    - distro >=1.7.0,<2
    - httpx-aiohttp >=0.1.9
    - anyio >=3.5.0,<5
    - certifi >=2026.10.19
tests:
  - python:
      imports:
        - fireworks
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Python client library for the Fireworks.ai Generative AI Platform
  license: MIT
  license_file: LICENSE
  homepage: https://fireworks.ai

extra:
  recipe-maintainers:
    - jan-janssen
