schema_version: 1

context:
  name: fireworks-ai
  version: "1.2.23"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/10/82/918b6f68fa98eacadb550068cf0c075d1138ffe1cbc6d798d073a067f0d1/fireworks_ai-${{ version }}.tar.gz
  sha256: 50999343468c342568b44265e0c1ae5956afac4ab1accd583b12c693cf4bbfa1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-fancy-pypi-readme
    - pip
  run:
    - python >=${{ python_min }}
    - httpx >=0.23.0,<1
    - pydantic >=1.9.0,<3
    - typing_extensions >=4.14,<5
    - aiohttp
    - sniffio
    - distro >=1.7.0,<2
    - httpx-aiohttp >=0.1.9
    - anyio >=3.5.0,<5
tests:
  - python:
      imports:
        - fireworks
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Python client library for the Fireworks.ai Generative AI Platform
  license: MIT
  license_file: LICENSE
  homepage: https://fireworks.ai

extra:
  recipe-maintainers:
    - jan-janssen
